<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Xeryuu Rich URL</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#08090b;color:#fff;font-family:Arial,sans-serif}body{padding:16px}.app{max-width:760px;margin:auto}.head{font-size:22px;font-weight:800;margin:4px 0 14px}.head b{color:#1ed760}.card{background:#15181c;border:1px solid #2a3037;border-radius:18px;padding:14px}.preview{width:100%;max-height:65vh;object-fit:contain;background:#090a0c;border-radius:12px}.audio{width:100%;margin-top:10px}.meta{margin-top:13px}.name{font-size:18px;font-weight:800;word-break:break-word}.muted{font-size:12px;color:#9299a3;margin-top:7px}.provider{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;background:#1d3327;color:#8ff0b0;font-size:11px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:12px;padding:11px 14px;text-decoration:none;font-weight:700;background:#1ed760;color:#071108}.btn.alt{background:#242a31;color:#fff}.url{margin-top:12px;padding:10px;background:#0d0f12;border-radius:10px;color:#aeb5bf;font-size:12px;word-break:break-all}</style></head>
<body><div class="app"><div class="head">Xeryuu <b>Rich URL</b></div><div class="card"><div id="preview"></div><div class="meta"><div id="name" class="name">File</div><div id="info" class="muted"></div><div id="provider" class="provider">Rich Upload</div><div class="actions"><a id="open" class="btn" target="_blank" rel="noopener">OPEN</a><button id="copy" class="btn alt">COPY LINK</button></div><div id="url" class="url"></div></div></div></div>
<script>(()=>{const D=__XERYUU_TOURL_BOOTSTRAP__, $=x=>document.getElementById(x);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mime=String(D.mimetype||'application/octet-stream').toLowerCase();$('name').textContent=D.filename||'file';$('info').textContent=(D.mimetype||'unknown')+(D.size?' • '+D.size:'');$('provider').textContent='UPLOAD: '+String(D.uploadHost||'Penyedia upload');const linkUrl=String(D.openUrl||D.url);$('url').textContent=linkUrl;$('open').href=linkUrl;let p='';if(mime.startsWith('image/'))p='<img class="preview" src="'+safe(D.url)+'" alt="preview">';else if(mime.startsWith('video/'))p='<video class="preview" src="'+safe(D.url)+'" controls playsinline></video>';else if(mime.startsWith('audio/'))p='<audio class="audio" src="'+safe(D.url)+'" controls></audio>';else p='<div class="url">Pratinjau tidak tersedia untuk jenis file ini. Gunakan tombol OPEN untuk membuka atau mengunduh file.</div>';$('preview').innerHTML=p;async function copyText(value){const text=String(value||'');if(!text)return false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch{}try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);const ok=document.execCommand('copy');ta.remove();if(ok)return true}catch{}return false}
$('copy').onclick=async()=>{const b=$('copy');b.disabled=true;const ok=await copyText(linkUrl);b.disabled=false;b.textContent=ok?'COPIED ✓':'COPY GAGAL';if(ok)setTimeout(()=>{b.textContent='COPY LINK'},1800)} })();</script></body></html>
