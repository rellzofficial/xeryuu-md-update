name: Sign Update Manifest

on:
  push:
    branches: [main]
    paths:
      - '.xeryuu-update.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-update-manifest-main
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sign manifest with Ed25519
        env:
          INTEGRITY_SIGNING_PRIVATE_KEY: ${{ secrets.INTEGRITY_SIGNING_PRIVATE_KEY }}
        run: node .github/scripts/sign-update-manifest.js

      - name: Commit signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .xeryuu-update.sig
          if git diff --cached --quiet; then
            echo "Signature already current."
          else
            git commit -m "chore: sign Xeryuu update manifest"
            git push origin HEAD:main
          fi
